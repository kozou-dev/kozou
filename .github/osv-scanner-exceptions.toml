# Exceptions for the blocking CVE gate.
#
# Consumed only by the `dependency-scan` job in workflows/security-scan.yml,
# via an explicit `--config`. It deliberately does NOT live at the repository
# root: osv-scanner auto-loads a root `osv-scanner.toml` for every scan, which
# would silently filter the unfiltered `dependency-scan-report` job too.
#
# WHAT THE BLOCKING GATE MEASURES
#
# Not this workspace. `scripts/derive-consumer-manifests.mjs` reconstructs, for
# each publishable package under packages/*, the dependency set a consumer
# installing it from npm would get, and the gate scans those resolved trees.
# So a finding here means an adopter is exposed, full stop - there is no
# scope judgement left to make, and therefore no list of packages to exclude.
#
# That is why this file holds only [[IgnoredVulns]] and no [[PackageOverrides]].
# Dev tooling, build tooling, examples/ and benchmarks/ never enter the gate's
# input in the first place, so they need no exclusion. They are still scanned,
# unfiltered, by the non-blocking `dependency-scan-report` job.
#
# WHAT BELONGS HERE
#
# Only a finding that is real, adopter-facing, and that kozou cannot fix:
# either the patch does not exist for the line our consumer's resolver can
# reach, or it exists but sits outside the range an upstream dependency
# declares, so taking it would mean forcing an unvetted major through a
# consumer's tree.
#
# Each entry must name the upstream condition that removes it. Not a date.
#
# NO `ignoreUntil` - ON PURPOSE
#
# An expiry date on a finding outside our control has exactly two exits when
# it fires: extend the date, or force the unvetted bump. The first is the
# suppression habit this whole design exists to avoid, and it blocks every PR
# in the meantime for something no one here can fix.
#
# The self-cleaning signal is the other direction, and it is mechanical:
# when upstream fixes the finding, this entry stops matching anything and
# osv-scanner reports `has unused ignores`. The blocking job treats that as a
# failure, so a stale exception cannot accumulate quietly - and unlike an
# expired date, that failure is always fixable here, by deleting the entry.

[[IgnoredVulns]]
id = "GHSA-frvp-7c67-39w9"
# Reached by anyone installing @kozou/mcp, via @modelcontextprotocol/sdk.
reason = """
Not reachable from kozou. The flaw is a path traversal in @hono/node-server's \
serveStatic on Windows via an encoded backslash, and serveStatic is never \
imported or referenced anywhere in the SDK. Its two imports from the package \
are getRequestListener (server/streamableHttp.js, the Streamable HTTP \
transport) and serve (an examples file); the only serve-static strings in the \
package are `declare module 'express-serve-static-core'` type augmentations, \
which belong to Express. The SDK is also the sole consumer of \
@hono/node-server in the tree. The patch is 2.0.5 while \
@modelcontextprotocol/sdk 1.29.0 declares ^1.19.9 with no 1.x backport, so \
clearing it would force an unvetted major into every adopter's MCP transport \
path. \
Removes itself when @modelcontextprotocol/sdk moves to @hono/node-server 2.x.
"""

[[IgnoredVulns]]
id = "GHSA-pxg6-pf52-xh8x"
# Reached by anyone installing @kozou/svelte-ui, via sveltekit-superforms ->
# peer @sveltejs/kit -> cookie. Surfaced by this gate on its first run; the
# old workspace-lockfile scan could not see it, because pnpm.overrides pinned
# cookie to 0.7.2 here while adopters still resolve 0.6.0.
reason = """
Unfixable from here: @sveltejs/kit 2.70.1 declares cookie: ^0.6.0, and 0.6.0 \
is the only release in that range - the fix landed in 0.7.0, outside it. A \
pnpm override cannot help, because overrides are workspace-local and never \
reach a consumer's resolver. Severity is low (out-of-bounds characters \
accepted in cookie name/path/domain). \
Removes itself when @sveltejs/kit widens its cookie range to include 0.7.x.
"""
