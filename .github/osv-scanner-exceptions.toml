reason = """
Unfixable from here, for the same reason as GHSA-27mw-82g8-phjj: affected is \
@sveltejs/kit < 3.0.0, and two peers keep a consumer on 2.x - the \
sveltekit-superforms 2.x peer (1.x || 2.x) and the optional peer of runed 0.35 \
(^2.21.0, via bits-ui and svelte-toolbelt). Severity is low (URL redirection \
to an untrusted site via enhanced form submission). \
Removes itself under the same conditions as GHSA-27mw-82g8-phjj: the advisory \
is amended to include a 2.x fix, or @kozou/svelte-ui moves to \
sveltekit-superforms 3 and bits-ui and svelte-toolbelt move to a runed whose \
kit peer admits 3.x.
"""

[[IgnoredVulns]]
id = "GHSA-gcqx-w48m-w2h4"
# Reached by anyone installing @kozou/svelte-ui, via peer @sveltejs/kit ->
# peer @sveltejs/vite-plugin-svelte -> deepmerge.
reason = """
Unfixable from here: no patched release exists. The advisory lists deepmerge \
>= 4.2.0, <= 4.3.1 as affected with no fixed version, and 4.3.1 is the latest \
release. Severity is low (prototype poisoning of objects returned by \
mergeObject()). \
Removes itself when a deepmerge release above 4.3.1 lands inside the ^4.3.1 \
range @sveltejs/vite-plugin-svelte declares (a fix published only as 5.x \
would not reach a consumer's resolver), or when @sveltejs/vite-plugin-svelte \
stops depending on deepmerge.
"""
