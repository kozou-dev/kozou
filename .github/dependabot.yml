# Dependabot config (Step 4-A3-c):
# Keep SHA-pinned GitHub Actions and npm dependencies up to date.
# Major upgrades land as PRs that need a manual review. Patch/minor can
# auto-merge if the repository's auto-merge setting is enabled (this file
# only guarantees the PRs; turning on auto-merge happens in repo settings).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Tokyo'
    # Major updates outside a group come one pull request each and stay open
    # until they are reviewed. The limit leaves room for several of them, so
    # they do not take every slot and keep a group pull request from opening.
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'Update'
      include: scope
    # A group counts as one pull request against open-pull-requests-limit.
    # Without groups, once open pull requests reach the limit they stop
    # every further version update for the ecosystem.
    groups:
      # init and analyze are parts of one CodeQL release. Bumped in separate
      # pull requests, one job runs two versions of the action.
      codeql:
        patterns:
          - 'github/codeql-action/*'
      actions-minor-patch:
        update-types:
          - minor
          - patch
        # Dependabot puts a dependency in every group that contains it, but a
        # group with patterns gives it up when another such group scores
        # higher, and a group without patterns outranks a wildcard pattern.
        # Without this exclusion, the CodeQL actions never reach codeql.
        exclude-patterns:
          - 'github/codeql-action/*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Tokyo'
    # Same reason as for actions: major updates outside a group stay open one
    # pull request each until they are reviewed, and the limit leaves room for
    # them beside the groups.
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'Update'
      include: scope
    # Cover every package in the workspace (root + packages/*).
    versioning-strategy: increase
    # Major updates come as pull requests of their own, for manual review;
    # a testcontainers major comes as one pull request for the pair.
    groups:
      # The E2E setup passes a testcontainers network into
      # @testcontainers/postgresql, which carries its own testcontainers.
      # Bumping one without the other fails typecheck.
      testcontainers:
        patterns:
          - 'testcontainers'
          - '@testcontainers/*'
      npm-minor-patch:
        update-types:
          - minor
          - patch
        # Same rule: without the exclusion, the testcontainers group gives up
        # @testcontainers/postgresql (a wildcard match) to this group but
        # keeps testcontainers (an exact match), so the two are bumped
        # separately. Excluding testcontainers as well keeps the pair from
        # depending on the order of the groups.
        exclude-patterns:
          - 'testcontainers'
          - '@testcontainers/*'
