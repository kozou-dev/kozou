# Dependabot config (Step 4-A3-c):
# Keep SHA-pinned GitHub Actions and npm dependencies up to date.
# Major upgrades land as PRs that need a manual review. Patch/minor can
# auto-merge if the repository's auto-merge setting is enabled (this file
# only guarantees the PRs; turning on auto-merge happens in repo settings).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'Update'
      include: scope
    # A group counts as one pull request against open-pull-requests-limit.
    # Without groups, five unmerged updates stop every further version
    # update for the ecosystem.
    groups:
      # init and analyze are parts of one CodeQL release. Bumped in separate
      # pull requests, one job runs two versions of the action.
      codeql:
        patterns:
          - 'github/codeql-action/*'
      actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'Update'
      include: scope
    # Cover every package in the workspace (root + packages/*).
    versioning-strategy: increase
    # Major updates stay in pull requests of their own, for manual review.
    groups:
      # The E2E setup passes a testcontainers network into
      # @testcontainers/postgresql, which carries its own testcontainers.
      # Bumping one without the other fails typecheck.
      testcontainers:
        patterns:
          - 'testcontainers'
          - '@testcontainers/*'
      npm-minor-patch:
        update-types:
          - minor
          - patch
