# Dependabot config (Step 4-A3-c):
# Keep SHA-pinned GitHub Actions and npm dependencies up to date.
# Major upgrades land as PRs that need a manual review. Patch/minor can
# auto-merge if the repository's auto-merge setting is enabled (this file
# only guarantees the PRs; turning on auto-merge happens in repo settings).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'Update'
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'Asia/Tokyo'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: 'Update'
      include: scope
    # Cover every package in the workspace (root + packages/*).
    versioning-strategy: increase
