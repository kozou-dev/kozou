name: License integrity check

# License 整合 (LICENSE / package.json / pyproject.toml / README.md がすべて
# Apache 2.0 を指していること) と、build artifact への AGPL/GPL/PostgREST
# 関連語の混入禁止 (LICENSING_POLICY.md §4) を自動チェックする。
#
# Policy 詳細: planning repo (private) の LICENSING_POLICY.md を参照。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supply chain hardening (Codex W2 反映、Step 4-A3-c):
# 最小 permissions を top-level で明示。
permissions:
  contents: read

# 2026-06-02 から GitHub Actions が Node.js 24 をデフォルトに強制し、
# Node.js 20 actions (actions/checkout@v4 等) は deprecated になる。
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# それまでの暫定対応として、明示的に Node 24 で実行させる。
# action 側が Node 24 対応版をリリースしたタイミングで本 env を削除する。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  metadata-integrity:
    name: License metadata 整合チェック
    runs-on: ubuntu-latest
    steps:
      # Codex W2: third-party actions は SHA pin (Dependabot で自動更新)。
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: LICENSE が Apache License 2.0 か
        run: |
          head -5 LICENSE | grep -q -i "Apache License" \
            || { echo "ERROR: LICENSE は Apache License 2.0 ではありません"; exit 1; }
          echo "✓ LICENSE は Apache License 2.0"

      - name: root package.json の license フィールドが Apache-2.0 か
        run: |
          grep -E '"license"[[:space:]]*:[[:space:]]*"Apache-2.0"' package.json \
            || { echo "ERROR: root package.json の license が Apache-2.0 ではありません"; exit 1; }
          echo "✓ root package.json license = Apache-2.0"

      - name: packages/*/package.json の license フィールドが Apache-2.0 か
        run: |
          shopt -s nullglob
          pkgs=(packages/*/package.json)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "✓ packages/* が空 (skeleton 段階)"
          else
            for pkg in "${pkgs[@]}"; do
              if ! grep -q -E '"license"[[:space:]]*:[[:space:]]*"Apache-2.0"' "$pkg"; then
                echo "ERROR: $pkg の license が Apache-2.0 ではありません"
                exit 1
              fi
              echo "✓ $pkg license = Apache-2.0"
            done
          fi

      - name: pyproject.toml の license / classifier が Apache か
        run: |
          grep -E 'license[[:space:]]*=[[:space:]]*\{[[:space:]]*text[[:space:]]*=[[:space:]]*"Apache-2.0"' pyproject.toml \
            || { echo "ERROR: pyproject.toml の license が Apache-2.0 ではありません"; exit 1; }
          grep -E '"License :: OSI Approved :: Apache Software License"' pyproject.toml \
            || { echo "ERROR: pyproject.toml の classifier が Apache Software License ではありません"; exit 1; }
          echo "✓ pyproject.toml license + classifier = Apache"

      - name: README.md の License 節が Apache 2.0 か
        run: |
          grep -E '^Apache 2\.0' README.md \
            || { echo "ERROR: README.md の License 節が 'Apache 2.0' ではありません"; exit 1; }
          echo "✓ README.md License = Apache 2.0"

      - name: コードファイルに AGPL/GPL/PostgREST 関連語が混入していないか
        # NOTE: 検査対象は TypeScript / JavaScript / Svelte / SQL のコードのみ。
        # exclude されるもの:
        # - markdown 文書 (policy / README / CONTRIBUTING / Kozou v0.1 spec を意図的に言及)
        # - YAML / YML (config / spec、kozou.config.yaml で `type: postgrest` を
        #   adapter type として指定するのは Kozou v0.1 spec §9.2 の正当な記述)
        # - TOML (pyproject.toml は別 step で license check 済み)
        # - GitHub Actions workflow ファイル (この workflow を含む)
        # - .eslintrc.cjs (PostgREST 言及は Kozou v0.1 spec §18.1.1 由来の防御 rule)
        # 混入リスクは配布 artifact (npm pack / python -m build) を grep する
        # artifact-grep job 側で別途検証する。
        run: |
          if git grep -i -n -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public' \
             -- '*.ts' '*.tsx' '*.js' '*.cjs' '*.mjs' '*.svelte' '*.sql' \
             ':(exclude).github/workflows/*.yml' \
             ':(exclude).eslintrc.cjs'; then
            echo "ERROR: code files に AGPL/GPL/PostgREST 関連語が含まれています"
            exit 1
          fi
          echo "✓ code files (*.ts/*.tsx/*.js/*.cjs/*.mjs/*.svelte/*.sql) に AGPL/GPL/PostgREST 関連語なし"

  artifact-grep:
    name: Build artifact 混入チェック
    runs-on: ubuntu-latest
    steps:
      # Codex W2: third-party actions は SHA pin (Dependabot で自動更新)。
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Python build tool を install
        run: pip install build

      - name: npm pack で packages/kozou の tarball を生成し code/binary 中身を grep
        # Step 2-4 で publish target を root から packages/kozou に retarget。
        # README/LICENSE/NOTICE/package.json は意図的に PostgREST や license 名を
        # 含む可能性があるため exclude。LICENSING_POLICY §4 の本来の目的
        # (PostgREST のソース/バイナリ/generated コードを配布物に混入させない)
        # を満たすには code/binary files の grep で十分。
        working-directory: packages/kozou
        run: |
          npm pack
          TGZ=$(ls kozou-*.tgz)
          echo "Inspecting $TGZ (excluding *.md / LICENSE / NOTICE / package.json metadata)"
          mkdir -p _npm_inspect && tar -xzf "$TGZ" -C _npm_inspect
          FILES=$(find _npm_inspect -type f \
              ! -name '*.md' ! -name '*.rst' ! -name '*.txt' \
              ! -name '*.yaml' ! -name '*.yml' ! -name '*.toml' \
              ! -name 'LICENSE' ! -name 'LICENSE.*' ! -name 'NOTICE' ! -name 'NOTICE.*' \
              ! -name 'package.json' ! -name 'pyproject.toml' \
              -print)
          if [ -z "$FILES" ]; then
            echo "✓ npm tarball clean (検査対象 code/binary ファイルなし、metadata のみ)"
          else
            echo "Checking files:"; echo "$FILES"
            if echo "$FILES" | xargs grep -i -H -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public'; then
              echo "ERROR: npm tarball の code/binary files に禁則語が混入"
              rm -rf _npm_inspect
              exit 1
            fi
            echo "✓ npm tarball clean (code/binary files に PostgREST/AGPL/GPL なし)"
          fi
          rm -rf _npm_inspect

      - name: python -m build で sdist + wheel を生成し code/binary 中身を grep
        run: |
          python -m build

          # sdist (.tar.gz)
          SDIST=$(ls dist/kozou-*.tar.gz)
          echo "Inspecting $SDIST (excluding *.md / LICENSE / NOTICE / PKG-INFO / metadata)"
          mkdir -p _sdist_inspect && tar -xzf "$SDIST" -C _sdist_inspect
          FILES=$(find _sdist_inspect -type f \
              ! -name '*.md' ! -name '*.rst' ! -name '*.txt' \
              ! -name '*.yaml' ! -name '*.yml' ! -name '*.toml' \
              ! -name 'LICENSE' ! -name 'LICENSE.*' ! -name 'NOTICE' ! -name 'NOTICE.*' \
              ! -name 'PKG-INFO' ! -name 'package.json' ! -name 'pyproject.toml' \
              -print)
          if [ -z "$FILES" ]; then
            echo "✓ PyPI sdist clean (検査対象 code/binary ファイルなし、metadata のみ)"
          else
            echo "Checking files:"; echo "$FILES"
            if echo "$FILES" | xargs grep -i -H -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public'; then
              echo "ERROR: PyPI sdist の code/binary files に禁則語が混入"
              rm -rf _sdist_inspect
              exit 1
            fi
            echo "✓ PyPI sdist clean (code/binary files に PostgREST/AGPL/GPL なし)"
          fi
          rm -rf _sdist_inspect

          # wheel (.whl) — ZipFile は glob を解釈しないので glob.glob で展開
          # documentation/metadata は同様に exclude
          python <<'PY'
          import zipfile, re, glob, sys
          whl = glob.glob('dist/kozou-*.whl')[0]
          print(f"Inspecting {whl} (excluding *.md / LICENSE / NOTICE / METADATA / WHEEL / RECORD)")
          z = zipfile.ZipFile(whl)
          pat = re.compile(rb'(?i)postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public')
          exclude_suffixes = ('.md', '.rst', '.txt', '.yaml', '.yml', '.toml')
          exclude_basenames = {'LICENSE', 'NOTICE', 'METADATA', 'PKG-INFO', 'RECORD', 'WHEEL', 'AUTHORS'}
          hits = []
          for n in z.namelist():
              if n.endswith('/'):
                  continue
              base = n.rsplit('/', 1)[-1]
              if any(n.endswith(s) for s in exclude_suffixes):
                  continue
              if base in exclude_basenames or base.startswith('LICENSE.') or base.startswith('NOTICE.'):
                  continue
              # dist-info 内の licenses/* も exclude
              if 'dist-info/licenses/' in n:
                  continue
              data = z.read(n)
              if pat.search(data):
                  hits.append((n, data[:200]))
          if hits:
              for n, snippet in hits:
                  print(f"HIT: {n}: {snippet!r}")
              print("ERROR: PyPI wheel の code/binary files に禁則語が混入")
              sys.exit(1)
          print("✓ PyPI wheel clean")
          PY
