name: License integrity check

# Verify the license metadata is consistent (LICENSE / package.json /
# pyproject.toml / README.md all point at Apache 2.0) and that no build
# artifact contains forbidden AGPL/GPL/PostgREST vocabulary.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supply chain hardening (Step 4-A3-c):
# declare the minimum permissions at the top level.
permissions:
  contents: read

# GitHub Actions makes Node.js 24 the default starting 2026-06-02 and
# Node 20 actions (actions/checkout@v4 etc.) become deprecated:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# As a stop-gap we force Node 24 on the action runners.
# Remove this env once each action ships a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  metadata-integrity:
    name: License metadata integrity check
    runs-on: ubuntu-latest
    steps:
      # SHA-pin third-party actions (kept fresh by Dependabot).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: LICENSE is Apache License 2.0
        run: |
          head -5 LICENSE | grep -q -i "Apache License" \
            || { echo "ERROR: LICENSE is not Apache License 2.0"; exit 1; }
          echo "OK: LICENSE is Apache License 2.0"

      - name: root package.json license = Apache-2.0
        run: |
          grep -E '"license"[[:space:]]*:[[:space:]]*"Apache-2.0"' package.json \
            || { echo "ERROR: root package.json license is not Apache-2.0"; exit 1; }
          echo "OK: root package.json license = Apache-2.0"

      - name: packages/*/package.json license = Apache-2.0
        run: |
          shopt -s nullglob
          pkgs=(packages/*/package.json)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "OK: packages/* is empty (skeleton stage)"
          else
            for pkg in "${pkgs[@]}"; do
              if ! grep -q -E '"license"[[:space:]]*:[[:space:]]*"Apache-2.0"' "$pkg"; then
                echo "ERROR: $pkg license is not Apache-2.0"
                exit 1
              fi
              echo "OK: $pkg license = Apache-2.0"
            done
          fi

      - name: pyproject.toml license / classifier is Apache
        run: |
          grep -E 'license[[:space:]]*=[[:space:]]*\{[[:space:]]*text[[:space:]]*=[[:space:]]*"Apache-2.0"' pyproject.toml \
            || { echo "ERROR: pyproject.toml license is not Apache-2.0"; exit 1; }
          grep -E '"License :: OSI Approved :: Apache Software License"' pyproject.toml \
            || { echo "ERROR: pyproject.toml classifier is not Apache Software License"; exit 1; }
          echo "OK: pyproject.toml license + classifier = Apache"

      - name: README.md License section says Apache 2.0
        run: |
          grep -E '^Apache 2\.0' README.md \
            || { echo "ERROR: README.md License section is not 'Apache 2.0'"; exit 1; }
          echo "OK: README.md License = Apache 2.0"

      - name: No non-English text in tracked files
        # Step 4-D: enforce the English-only policy declared in
        # AGENTS.md at CI time. The intent is to prevent any non-Latin
        # script (Japanese, Korean, Cyrillic, Arabic, Hebrew,
        # Devanagari, Thai, ...) from sneaking into a globally-
        # oriented OSS repo, not to single out a specific language.
        # Latin diacritics (é, ü, ñ, ...) and Greek (used in math
        # notation) are intentionally allowed. The script uses
        # `perl -CSDA` so it stays portable on macOS (BSD grep has no
        # -P). See scripts/check-english-only.sh for the full check.
        run: bash scripts/check-english-only.sh

      - name: No AGPL/GPL/PostgREST vocabulary in code files
        # NOTE: this check scans only TypeScript / JavaScript / Svelte /
        # SQL code. Excluded by design:
        # - markdown docs (policy / README / CONTRIBUTING
        #   intentionally mention these names)
        # - YAML / YML (configs - using `type: postgrest` as the
        #   adapter type is the documented option)
        # - TOML (pyproject.toml is verified separately above)
        # - GitHub Actions workflow files (including this one)
        # - .eslintrc.cjs (mentions PostgREST only inside the defensive
        #   rule)
        # - packages/kozou/src/config.ts (the adapter.type literal is
        #   the discriminator value 'postgrest'; it identifies the
        #   adapter, not the implementation)
        # - packages/kozou/test/config.test.ts (asserts the spec's
        #   discriminator literal)
        # - packages/svelte-ui/src/lib/adapter/postgrest.ts (the
        #   PostgrestDataAdapter implementation; calls into the
        #   PostgREST HTTP surface but ships none of the PostgREST
        #   source/binary itself)
        # - packages/svelte-ui/src/lib/adapter/index.ts (re-exports
        #   the PostgrestDataAdapter / PostgrestAdapterError symbols
        #   above; identifier strings only, no PostgREST code)
        # - packages/svelte-ui/src/lib/index.ts (top-level package
        #   re-export of the same adapter symbols ahead of the Step 7
        #   publish flip; identifier strings only)
        # - packages/svelte-ui/src/lib/server/adapter.ts (server-side
        #   DataAdapter singleton that constructs PostgrestDataAdapter
        #   from KOZOU_ADAPTER_URL; identifier strings + import path
        #   only, all PostgREST behaviour lives in postgrest.ts)
        # - packages/svelte-ui/test/adapter/postgrest.*.test.ts (asserts
        #   the URLs/headers the adapter sends; documented coverage
        #   only)
        # - packages/svelte-ui/test/server/adapter.test.ts (unit-tests
        #   the server DataAdapter singleton; vi.mock replaces the
        #   PostgrestDataAdapter export the module imports - the mocked
        #   export name is fixed by the module under test, identifier only)
        # - packages/svelte-ui/e2e/** (Playwright E2E suite; spawns
        #   postgrest/postgrest as a sidecar container via
        #   testcontainers. The directory ships no PostgREST source /
        #   binary; it only references the public Docker image tag +
        #   env var names.)
        # - packages/svelte-ui/playwright.config.ts (Playwright config
        #   header documenting the same sidecar arrangement)
        # - packages/kozou/e2e/** (the `kozou dev` full-stack Playwright
        #   suite; launches `kozou dev`
        #   against the same postgrest sidecar via testcontainers. Ships
        #   no PostgREST source / binary; references the public Docker
        #   image tag + env var names only, and is not in the package's
        #   published `files`.)
        # - packages/kozou/playwright.config.ts (Playwright config header
        #   documenting the same sidecar arrangement)
        # The actual contamination risk lives in shippable artifacts
        # (npm pack / python -m build); the artifact-grep job below
        # covers those separately.
        run: |
          if git grep -i -n -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public' \
             -- '*.ts' '*.tsx' '*.js' '*.cjs' '*.mjs' '*.svelte' '*.sql' \
             ':(exclude).github/workflows/*.yml' \
             ':(exclude).eslintrc.cjs' \
             ':(exclude)packages/kozou/src/config.ts' \
             ':(exclude)packages/kozou/test/config.test.ts' \
             ':(exclude)packages/svelte-ui/src/lib/adapter/index.ts' \
             ':(exclude)packages/svelte-ui/src/lib/adapter/postgrest.ts' \
             ':(exclude)packages/svelte-ui/src/lib/index.ts' \
             ':(exclude)packages/svelte-ui/src/lib/server/adapter.ts' \
             ':(exclude)packages/svelte-ui/test/adapter/postgrest.*.test.ts' \
             ':(exclude)packages/svelte-ui/test/server/adapter.test.ts' \
             ':(exclude)packages/svelte-ui/e2e/**' \
             ':(exclude)packages/svelte-ui/playwright.config.ts' \
             ':(exclude)packages/kozou/e2e/**' \
             ':(exclude)packages/kozou/playwright.config.ts'; then
            echo "ERROR: code files contain AGPL/GPL/PostgREST vocabulary"
            exit 1
          fi
          echo "OK: code files (*.ts/*.tsx/*.js/*.cjs/*.mjs/*.svelte/*.sql) are clean"

  npm-artifact-grep:
    name: npm artifact integrity (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    # Step 7-D matrix-ized this job (Step 6-M addendum). Each matrix leg packs a single
    # workspace package, unpacks the tarball, and verifies the
    # code/binary files contain no forbidden vocabulary.
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: kozou
            filter: kozou
            tgz_glob: 'kozou-[0-9]*.tgz'
            forbidden_regex: 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public'
            # The compiled `dist/config.js` + `dist/config.d.ts`
            # carry the `adapter.type: 'postgrest'` discriminator
            # literal - the exact string the code-grep job above
            # already exempts from `packages/kozou/src/config.ts`. The
            # literal is a configuration value identifying the adapter,
            # not PostgREST source / binary / generated code.
            # Path-anchor the exclusion so a future
            # `config.js` somewhere else in the tarball would still
            # be scanned.
            extra_excludes: "! -path '*/dist/config.js' ! -path '*/dist/config.d.ts'"
            # Step 7-G: every entry here must appear in
            # `npm pack --dry-run`. Catches a publish-config
            # regression (e.g. someone trims `files` or breaks
            # the build script) before the artifact ships.
            expected_files: |
              dist/cli.js
              dist/create-kozou.js
              dist/index.js
              dist/index.d.ts
              dist/templates/docker-compose.yml
              dist/templates/env.example
              dist/templates/kozou.config.yaml
              dist/templates/ui-hints.yaml
              dist/templates/migrations/0001_init.sql
          - pkg: svelte-ui
            filter: '@kozou/svelte-ui'
            tgz_glob: 'kozou-svelte-ui-*.tgz'
            # The svelte-ui adapter-node bundle inlines the
            # `PostgrestDataAdapter` class name into the hashed
            # server chunk. The class identifier is
            # not PostgREST source / binary / generated code
            # (only the latter is forbidden), and
            # the bundled chunk's hashed filename makes a stable
            # exclude list impractical. Drop `postgrest|pgrst` from
            # the alternation; AGPL / GPL / "GNU Affero" / "GNU
            # General Public" stay enforced - those would always
            # indicate a real license problem.
            forbidden_regex: 'agpl|gnu affero|gpl-3|gnu general public'
            # svelte-ui has no analogous in-publish discriminator
            # file; the bundled `PostgrestDataAdapter` identifier
            # was already taken care of by dropping
            # `postgrest|pgrst` from `forbidden_regex`.
            extra_excludes: ""
            # adapter-node always emits handler.js + index.js at
            # the root of `build/`. The hashed `server/` and
            # `client/` chunks are not pinned by basename, so they
            # are not asserted here.
            expected_files: |
              build/handler.js
              build/index.js
    env:
      # `svelte-check` / Svelte 5 + the @kozou/svelte-ui workspace
      # push past the runner's default ~2 GB Node heap during the
      # vite build. Matches the bump in ci.yml (Step 6-Z-2).
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      # SHA-pin third-party actions (kept fresh by Dependabot).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Pin to .nvmrc (Node 24) so the svelte-ui matrix leg has
          # the same runtime as ci.yml; the kozou leg is content
          # with anything >= 20, but matching versions avoids a
          # second cache surface.
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages (so workspace:* deps resolve)
        # Step 7-A / 7-C flipped every publish target to consume its
        # workspace dependencies through built output (`dist/` for
        # kozou + core + introspect + mcp, `build/` for svelte-ui).
        # Building just ${{ matrix.pkg }} would leave its
        # `workspace:*` references unresolved, so build the full tree
        # in topological order before pack. svelte-ui's vite build
        # only inflates this job; it never reaches the tarball
        # except in the svelte-ui matrix leg.
        run: pnpm -r run build

      - name: npm pack --dry-run file-list assertion
        # Step 7-G: assert every entry in `expected_files` ships and
        # that no `src/**` leaks into the tarball. Runs before the
        # actual `npm pack` below so a publish-config regression
        # surfaces ahead of any download/scan overhead.
        working-directory: packages/${{ matrix.pkg }}
        run: |
          npm pack --dry-run 2>&1 | tee pack-dryrun.txt

          MISSING=
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! grep -qE "[[:space:]]${f}\$" pack-dryrun.txt; then
              echo "MISSING: $f"
              MISSING="$MISSING $f"
            else
              echo "OK: $f present"
            fi
          done <<EOF
          ${{ matrix.expected_files }}
          EOF

          if [ -n "$MISSING" ]; then
            echo "ERROR: ${{ matrix.pkg }} tarball is missing required files:$MISSING"
            exit 1
          fi

          # `npm pack --dry-run` prefixes the summary line with the
          # tarball filename, which can contain "src" inside
          # `svelte-ui` etc. Anchor the search on the
          # `npm notice <size> <path>` shape so only listed entries
          # match.
          if grep -E '^npm notice +[0-9.]+[kMG]?B +src/' pack-dryrun.txt; then
            echo "ERROR: ${{ matrix.pkg }} tarball lists src/** entries (publish should be dist/build only)"
            exit 1
          fi
          echo "OK: ${{ matrix.pkg }} tarball ships no src/** entries"

      - name: npm pack ${{ matrix.pkg }} + grep code/binary contents
        # README / LICENSE / NOTICE / package.json metadata are
        # intentionally allowed to mention PostgREST and license
        # names, so we exclude them. The actual goal (keep PostgREST
        # source / binary / generated code out of the published
        # artifacts) is satisfied by grepping the code/binary files
        # only.
        #
        # The Step 5 CLI scaffold ships env.example as a configuration
        # template that mentions `postgrest` as the default adapter
        # URL host - that is a configuration value, not PostgREST
        # code/binary, so we exclude that one file by basename. We
        # deliberately do NOT exclude every *.example because a
        # future code-like example (e.g. example.ts) must still be
        # scanned. Step 7-A moved env.example into `dist/templates/`,
        # which keeps the same basename so the exclusion still works.
        working-directory: packages/${{ matrix.pkg }}
        run: |
          npm pack
          TGZ=$(ls ${{ matrix.tgz_glob }})
          echo "Inspecting $TGZ (regex: ${{ matrix.forbidden_regex }})"
          mkdir -p _npm_inspect && tar -xzf "$TGZ" -C _npm_inspect
          FILES=$(find _npm_inspect -type f \
              ! -name '*.md' ! -name '*.rst' ! -name '*.txt' \
              ! -name '*.yaml' ! -name '*.yml' ! -name '*.toml' \
              ! -name 'env.example' \
              ! -name 'LICENSE' ! -name 'LICENSE.*' ! -name 'NOTICE' ! -name 'NOTICE.*' \
              ! -name 'package.json' ! -name 'pyproject.toml' \
              ${{ matrix.extra_excludes }} \
              -print)
          if [ -z "$FILES" ]; then
            echo "OK: ${{ matrix.pkg }} tarball clean (no code/binary files to scan, metadata only)"
          else
            echo "Checking files:"; echo "$FILES"
            if echo "$FILES" | xargs grep -i -H -E '${{ matrix.forbidden_regex }}'; then
              echo "ERROR: ${{ matrix.pkg }} tarball code/binary files contain forbidden vocabulary"
              rm -rf _npm_inspect
              exit 1
            fi
            echo "OK: ${{ matrix.pkg }} tarball clean (code/binary files contain no forbidden terms)"
          fi
          rm -rf _npm_inspect

      - name: pnpm licenses list - no forbidden AGPL/GPL/SSPL/BUSL
        # Walk the transitive dependency tree pnpm resolved for the
        # filtered package and fail the build if any direct or
        # transitive dep is under AGPL, GPL-2/3, SSPL, or BUSL.
        # Match the SPDX simple-expression prefix so composite
        # expressions like `(MIT OR GPL-2.0)` - which let the
        # consumer pick the permissive side - do not produce a
        # false positive. Stricter SPDX parsing is deferred to
        # v0.1.1 if a real false-negative ever shows up.
        run: |
          if pnpm licenses list --recursive --filter ${{ matrix.filter }} --json \
              | jq -r 'keys[]?' \
              | grep -E '^(AGPL|GPL-[23]|SSPL|BUSL)'; then
            echo "ERROR: ${{ matrix.pkg }} transitive deps include a forbidden copyleft license"
            exit 1
          fi
          echo "OK: ${{ matrix.pkg }} transitive license set has no AGPL/GPL/SSPL/BUSL"

  pypi-artifact-grep:
    name: PyPI artifact integrity check (kozou wheel + sdist)
    # Step 7-D split this job out of the matrix above so the matrix
    # can stay focused on npm. `python -m build` only applies to the
    # top-level `kozou` PyPI publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install the Python build tool
        run: pip install build

      - name: python -m build then grep code/binary contents of sdist + wheel
        run: |
          python -m build

          # sdist (.tar.gz)
          SDIST=$(ls dist/kozou-*.tar.gz)
          echo "Inspecting $SDIST (excluding *.md / LICENSE / NOTICE / PKG-INFO / metadata)"
          mkdir -p _sdist_inspect && tar -xzf "$SDIST" -C _sdist_inspect
          FILES=$(find _sdist_inspect -type f \
              ! -name '*.md' ! -name '*.rst' ! -name '*.txt' \
              ! -name '*.yaml' ! -name '*.yml' ! -name '*.toml' \
              ! -name 'LICENSE' ! -name 'LICENSE.*' ! -name 'NOTICE' ! -name 'NOTICE.*' \
              ! -name 'PKG-INFO' ! -name 'package.json' ! -name 'pyproject.toml' \
              -print)
          if [ -z "$FILES" ]; then
            echo "OK: PyPI sdist clean (no code/binary files to scan, metadata only)"
          else
            echo "Checking files:"; echo "$FILES"
            if echo "$FILES" | xargs grep -i -H -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public'; then
              echo "ERROR: PyPI sdist code/binary files contain forbidden vocabulary"
              rm -rf _sdist_inspect
              exit 1
            fi
            echo "OK: PyPI sdist clean (code/binary files contain no PostgREST/AGPL/GPL terms)"
          fi
          rm -rf _sdist_inspect

          # wheel (.whl) - ZipFile does not glob, so use glob.glob to
          # enumerate. Documentation/metadata are excluded the same way.
          python <<'PY'
          import zipfile, re, glob, sys
          whl = glob.glob('dist/kozou-*.whl')[0]
          print(f"Inspecting {whl} (excluding *.md / LICENSE / NOTICE / METADATA / WHEEL / RECORD)")
          z = zipfile.ZipFile(whl)
          pat = re.compile(rb'(?i)postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public')
          exclude_suffixes = ('.md', '.rst', '.txt', '.yaml', '.yml', '.toml')
          exclude_basenames = {'LICENSE', 'NOTICE', 'METADATA', 'PKG-INFO', 'RECORD', 'WHEEL', 'AUTHORS'}
          hits = []
          for n in z.namelist():
              if n.endswith('/'):
                  continue
              base = n.rsplit('/', 1)[-1]
              if any(n.endswith(s) for s in exclude_suffixes):
                  continue
              if base in exclude_basenames or base.startswith('LICENSE.') or base.startswith('NOTICE.'):
                  continue
              # Exclude dist-info/licenses/* as well
              if 'dist-info/licenses/' in n:
                  continue
              data = z.read(n)
              if pat.search(data):
                  hits.append((n, data[:200]))
          if hits:
              for n, snippet in hits:
                  print(f"HIT: {n}: {snippet!r}")
              print("ERROR: PyPI wheel code/binary files contain forbidden vocabulary")
              sys.exit(1)
          print("OK: PyPI wheel clean")
          PY
