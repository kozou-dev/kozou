name: License integrity check

# Verify the license metadata is consistent (LICENSE / package.json /
# pyproject.toml / README.md all point at Apache 2.0) and that no build
# artifact contains forbidden AGPL/GPL/PostgREST vocabulary (per Kozou
# v0.1 license compliance §4).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supply chain hardening (Codex W2, Step 4-A3-c):
# declare the minimum permissions at the top level.
permissions:
  contents: read

# GitHub Actions makes Node.js 24 the default starting 2026-06-02 and
# Node 20 actions (actions/checkout@v4 etc.) become deprecated:
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
# As a stop-gap we force Node 24 on the action runners.
# Remove this env once each action ships a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  metadata-integrity:
    name: License metadata integrity check
    runs-on: ubuntu-latest
    steps:
      # Codex W2: SHA-pin third-party actions (kept fresh by Dependabot).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: LICENSE is Apache License 2.0
        run: |
          head -5 LICENSE | grep -q -i "Apache License" \
            || { echo "ERROR: LICENSE is not Apache License 2.0"; exit 1; }
          echo "OK: LICENSE is Apache License 2.0"

      - name: root package.json license = Apache-2.0
        run: |
          grep -E '"license"[[:space:]]*:[[:space:]]*"Apache-2.0"' package.json \
            || { echo "ERROR: root package.json license is not Apache-2.0"; exit 1; }
          echo "OK: root package.json license = Apache-2.0"

      - name: packages/*/package.json license = Apache-2.0
        run: |
          shopt -s nullglob
          pkgs=(packages/*/package.json)
          if [ ${#pkgs[@]} -eq 0 ]; then
            echo "OK: packages/* is empty (skeleton stage)"
          else
            for pkg in "${pkgs[@]}"; do
              if ! grep -q -E '"license"[[:space:]]*:[[:space:]]*"Apache-2.0"' "$pkg"; then
                echo "ERROR: $pkg license is not Apache-2.0"
                exit 1
              fi
              echo "OK: $pkg license = Apache-2.0"
            done
          fi

      - name: pyproject.toml license / classifier is Apache
        run: |
          grep -E 'license[[:space:]]*=[[:space:]]*\{[[:space:]]*text[[:space:]]*=[[:space:]]*"Apache-2.0"' pyproject.toml \
            || { echo "ERROR: pyproject.toml license is not Apache-2.0"; exit 1; }
          grep -E '"License :: OSI Approved :: Apache Software License"' pyproject.toml \
            || { echo "ERROR: pyproject.toml classifier is not Apache Software License"; exit 1; }
          echo "OK: pyproject.toml license + classifier = Apache"

      - name: README.md License section says Apache 2.0
        run: |
          grep -E '^Apache 2\.0' README.md \
            || { echo "ERROR: README.md License section is not 'Apache 2.0'"; exit 1; }
          echo "OK: README.md License = Apache 2.0"

      - name: No non-English text in tracked files
        # Step 4-D: enforce the English-only policy declared in
        # AGENTS.md at CI time. The intent is to prevent any non-Latin
        # script (Japanese, Korean, Cyrillic, Arabic, Hebrew,
        # Devanagari, Thai, ...) from sneaking into a globally-
        # oriented OSS repo, not to single out a specific language.
        # Latin diacritics (é, ü, ñ, ...) and Greek (used in math
        # notation) are intentionally allowed. The script uses
        # `perl -CSDA` so it stays portable on macOS (BSD grep has no
        # -P). See scripts/check-english-only.sh for the full check.
        run: bash scripts/check-english-only.sh

      - name: No AGPL/GPL/PostgREST vocabulary in code files
        # NOTE: this check scans only TypeScript / JavaScript / Svelte /
        # SQL code. Excluded by design:
        # - markdown docs (policy / README / CONTRIBUTING / Kozou v0.1
        #   spec intentionally mention these names)
        # - YAML / YML (configs / spec - using `type: postgrest` as the
        #   adapter type is the documented option per Kozou v0.1 spec §9.2)
        # - TOML (pyproject.toml is verified separately above)
        # - GitHub Actions workflow files (including this one)
        # - .eslintrc.cjs (mentions PostgREST only inside the defensive
        #   rule defined per Kozou v0.1 spec §18.1.1)
        # - packages/kozou/src/config.ts (the adapter.type literal is
        #   the discriminator value 'postgrest' defined by Kozou v0.1
        #   spec §9.2; it identifies the adapter, not the implementation)
        # - packages/kozou/test/config.test.ts (asserts the spec's
        #   discriminator literal)
        # The actual contamination risk lives in shippable artifacts
        # (npm pack / python -m build); the artifact-grep job below
        # covers those separately.
        run: |
          if git grep -i -n -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public' \
             -- '*.ts' '*.tsx' '*.js' '*.cjs' '*.mjs' '*.svelte' '*.sql' \
             ':(exclude).github/workflows/*.yml' \
             ':(exclude).eslintrc.cjs' \
             ':(exclude)packages/kozou/src/config.ts' \
             ':(exclude)packages/kozou/test/config.test.ts'; then
            echo "ERROR: code files contain AGPL/GPL/PostgREST vocabulary"
            exit 1
          fi
          echo "OK: code files (*.ts/*.tsx/*.js/*.cjs/*.mjs/*.svelte/*.sql) are clean"

  artifact-grep:
    name: Build artifact integrity check
    runs-on: ubuntu-latest
    steps:
      # Codex W2: SHA-pin third-party actions (kept fresh by Dependabot).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install the Python build tool
        run: pip install build

      - name: npm pack packages/kozou and grep code/binary contents
        # Step 2-4 moved the publish target from the root to
        # packages/kozou. README/LICENSE/NOTICE/package.json metadata
        # are intentionally allowed to mention PostgREST and license
        # names, so we exclude them. The actual goal of Kozou v0.1
        # license compliance §4 (keep PostgREST source / binary /
        # generated code out of the published artifacts) is satisfied
        # by grepping the code/binary files only.
        #
        # The Step 5 CLI scaffold ships env.example /
        # kozou.config.yaml templates that mention `postgrest` as the
        # default adapter URL host - that is a configuration value,
        # not PostgREST code/binary, so we also exclude *.example.
        working-directory: packages/kozou
        run: |
          npm pack
          TGZ=$(ls kozou-*.tgz)
          echo "Inspecting $TGZ (excluding *.md / LICENSE / NOTICE / package.json metadata / *.example)"
          mkdir -p _npm_inspect && tar -xzf "$TGZ" -C _npm_inspect
          FILES=$(find _npm_inspect -type f \
              ! -name '*.md' ! -name '*.rst' ! -name '*.txt' \
              ! -name '*.yaml' ! -name '*.yml' ! -name '*.toml' \
              ! -name '*.example' \
              ! -name 'LICENSE' ! -name 'LICENSE.*' ! -name 'NOTICE' ! -name 'NOTICE.*' \
              ! -name 'package.json' ! -name 'pyproject.toml' \
              -print)
          if [ -z "$FILES" ]; then
            echo "OK: npm tarball clean (no code/binary files to scan, metadata only)"
          else
            echo "Checking files:"; echo "$FILES"
            if echo "$FILES" | xargs grep -i -H -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public'; then
              echo "ERROR: npm tarball code/binary files contain forbidden vocabulary"
              rm -rf _npm_inspect
              exit 1
            fi
            echo "OK: npm tarball clean (code/binary files contain no PostgREST/AGPL/GPL terms)"
          fi
          rm -rf _npm_inspect

      - name: python -m build then grep code/binary contents of sdist + wheel
        run: |
          python -m build

          # sdist (.tar.gz)
          SDIST=$(ls dist/kozou-*.tar.gz)
          echo "Inspecting $SDIST (excluding *.md / LICENSE / NOTICE / PKG-INFO / metadata)"
          mkdir -p _sdist_inspect && tar -xzf "$SDIST" -C _sdist_inspect
          FILES=$(find _sdist_inspect -type f \
              ! -name '*.md' ! -name '*.rst' ! -name '*.txt' \
              ! -name '*.yaml' ! -name '*.yml' ! -name '*.toml' \
              ! -name 'LICENSE' ! -name 'LICENSE.*' ! -name 'NOTICE' ! -name 'NOTICE.*' \
              ! -name 'PKG-INFO' ! -name 'package.json' ! -name 'pyproject.toml' \
              -print)
          if [ -z "$FILES" ]; then
            echo "OK: PyPI sdist clean (no code/binary files to scan, metadata only)"
          else
            echo "Checking files:"; echo "$FILES"
            if echo "$FILES" | xargs grep -i -H -E 'postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public'; then
              echo "ERROR: PyPI sdist code/binary files contain forbidden vocabulary"
              rm -rf _sdist_inspect
              exit 1
            fi
            echo "OK: PyPI sdist clean (code/binary files contain no PostgREST/AGPL/GPL terms)"
          fi
          rm -rf _sdist_inspect

          # wheel (.whl) - ZipFile does not glob, so use glob.glob to
          # enumerate. Documentation/metadata are excluded the same way.
          python <<'PY'
          import zipfile, re, glob, sys
          whl = glob.glob('dist/kozou-*.whl')[0]
          print(f"Inspecting {whl} (excluding *.md / LICENSE / NOTICE / METADATA / WHEEL / RECORD)")
          z = zipfile.ZipFile(whl)
          pat = re.compile(rb'(?i)postgrest|pgrst|agpl|gnu affero|gpl-3|gnu general public')
          exclude_suffixes = ('.md', '.rst', '.txt', '.yaml', '.yml', '.toml')
          exclude_basenames = {'LICENSE', 'NOTICE', 'METADATA', 'PKG-INFO', 'RECORD', 'WHEEL', 'AUTHORS'}
          hits = []
          for n in z.namelist():
              if n.endswith('/'):
                  continue
              base = n.rsplit('/', 1)[-1]
              if any(n.endswith(s) for s in exclude_suffixes):
                  continue
              if base in exclude_basenames or base.startswith('LICENSE.') or base.startswith('NOTICE.'):
                  continue
              # Exclude dist-info/licenses/* as well
              if 'dist-info/licenses/' in n:
                  continue
              data = z.read(n)
              if pat.search(data):
                  hits.append((n, data[:200]))
          if hits:
              for n, snippet in hits:
                  print(f"HIT: {n}: {snippet!r}")
              print("ERROR: PyPI wheel code/binary files contain forbidden vocabulary")
              sys.exit(1)
          print("OK: PyPI wheel clean")
          PY
