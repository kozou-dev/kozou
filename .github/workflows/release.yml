name: Release

# v0.1.x release pipeline.
#
# Triggers:
# - push of a `vX.Y.Z` tag - the production path
# - workflow_dispatch - exercise the workflow without publishing
#
# Stages:
# 1. verify   - typecheck / lint / test / english-only re-run
#               against the tag's tree
# 2. publish-npm   - matrix: build then `pnpm publish --provenance`
#               via OIDC trusted publishing (no NPM_TOKEN)
# 3. publish-docker - `docker buildx build --push` to GHCR + cosign
#               keyless image signing (Fulcio + Rekor)
# 4. github-release - npm pack each tarball, cosign sign-blob, attach
#               as Release assets with auto-generated notes
#
# All third-party actions are SHA-pinned. The pin set
# was captured at Step 7-Z-6 from each action's latest stable tag
# (docker/setup-buildx-action v3, docker/login-action v3,
# docker/build-push-action v6, sigstore/cosign-installer v3,
# softprops/action-gh-release v2). docker/setup-qemu-action v3.7.0
# was added for the multi-arch publish. Dependabot keeps each pin
# fresh - see .github/dependabot.yml.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Skip the actual publish / push / release-create. Use to smoke-test the workflow on a non-tag run.'
        type: boolean
        default: true

# Top-level permissions stay minimal; each job upgrades to what it
# needs (supply-chain hardening).
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Matches the heap bump in ci.yml (Step 6-Z-2) - svelte-check +
  # Svelte 5 + the svelte-ui vite build exceed the runner default.
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  verify:
    name: Verify (typecheck / lint / test / english-only)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kozou
          POSTGRES_DB: kozou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KOZOU_TEST_DATABASE_URL: postgres://postgres:kozou@localhost:5432/kozou_test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (so workspace:* deps resolve)
        # Step 7-A flipped the four publish-target packages to dist/,
        # so `tsc --noEmit` must see real `dist/index.d.ts` files for
        # every `workspace:*` resolution. Same pattern as ci.yml.
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm -r --if-present test

      - name: English-only gate
        run: bash scripts/check-english-only.sh

  publish-npm:
    name: Publish ${{ matrix.pkg }} to npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # OIDC token is used for both npm provenance attestation and
      # for npmjs.com's trusted publisher exchange. Set up the
      # trusted publisher per-package in npmjs.com beforehand - the
      # post-Step-7 setup checklist in the plan covers the exact
      # one-time registration steps.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: '@kozou/core'
            dir: core
          - pkg: '@kozou/introspect'
            dir: introspect
          - pkg: '@kozou/mcp'
            dir: mcp
          - pkg: kozou
            dir: kozou
          - pkg: '@kozou/svelte-ui'
            dir: svelte-ui
          - pkg: '@kozou/api'
            dir: api
          - pkg: '@kozou/codegen'
            dir: codegen
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          # NOTE: registry-url is intentionally omitted. The
          # setup-node action writes `//registry.npmjs.org/:_authToken=
          # ${NODE_AUTH_TOKEN}` into `~/.npmrc` when registry-url is set,
          # and npm CLI then prefers that classic-token auth over OIDC
          # trusted publishing. With NODE_AUTH_TOKEN unset (we use OIDC,
          # not a long-lived token), the token line becomes an empty
          # bearer and the registry returns 404 - exactly the symptom
          # this hotfix chases.
          cache: 'pnpm'

      - name: Configure npm registry without a token line (so OIDC takes over)
        run: |
          # Write a registry-only `.npmrc`. npm CLI will then discover
          # there's no Authorization header to send, see `--provenance`,
          # and trigger the OIDC trusted-publisher token exchange end-to-
          # end (Sigstore audience + npm:registry.npmjs.org audience).
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc
          cat ~/.npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (all workspace packages so workspace:* refs resolve)
        run: pnpm -r run build

      - name: pnpm pack + npm publish (provenance via OIDC)
        working-directory: packages/${{ matrix.dir }}
        run: |
          # Real publish is gated on `github.event_name == 'push'`
          # i.e. a `vX.Y.Z` tag push. `workflow_dispatch` always
          # falls into the dry-run branch regardless of the
          # `dry_run` input, because a `dry_run=false` dispatch
          # would otherwise burn the npm version without the
          # matching `publish-docker` / `github-release` jobs
          # (those are also gated on `event_name == 'push'`).
          # The `dry_run` input still exists as documentation +
          # symmetry, but does not change behaviour here.
          #
          # `pnpm pack` + `npm publish <tgz>` is the documented
          # path for OIDC trusted publishing on pnpm workspaces:
          #   - `pnpm pack` rewrites every `workspace:*` reference
          #     in the tarball's `package.json` to a real semver
          #     (`npm pack` would leave it literal),
          #   - `npm publish` (npm CLI 11.5+, see .nvmrc=24) wraps
          #     both required OIDC audiences -
          #     `sigstore` (provenance attestation) +
          #     `npm:registry.npmjs.org` (registry write auth).
          # See Step 7-Z-8 ~ 7-Z-11 for the root-cause trail.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Idempotent publish. A tag push runs the whole matrix, but a
            # package may already be on npm at its current version - e.g. a
            # later tag that debuts a new package (@kozou/api / @kozou/codegen)
            # while the already-published packages are unchanged. Skip those
            # so `npm publish` does not fail the job on a duplicate version,
            # which would otherwise block github-release / update-docs-site
            # through their `needs:` on this job.
            PKG_VERSION="$(node -p "require('./package.json').version")"
            if npm view "${{ matrix.pkg }}@${PKG_VERSION}" version >/dev/null 2>&1; then
              echo "${{ matrix.pkg }}@${PKG_VERSION} is already on npm; skipping publish."
            else
              echo "Publishing ${{ matrix.pkg }}@${PKG_VERSION} to npm via npm CLI (pnpm pack handles the workspace:* rewrite)"
              pnpm pack
              TGZ=$(ls *.tgz | head -1)
              echo "Packed tarball: $TGZ"
              npm publish "$TGZ" --access public --provenance
            fi
          else
            echo "Dry-run mode (event=$GITHUB_EVENT_NAME, dry_run=${{ inputs.dry_run }}): pnpm publish --dry-run for ${{ matrix.pkg }}"
            pnpm publish --access public --provenance --no-git-checks --dry-run
          fi

  publish-docker:
    name: Build and push kozou Docker image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Cosign keyless signing exchanges this OIDC token for a
      # short-lived Fulcio certificate.
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU (emulators for non-amd64 build platforms)
        # Required so that buildx can cross-build the linux/arm64 leg
        # on the linux/amd64 GitHub-hosted runner. v0.1.0 shipped
        # amd64 only and Apple Silicon `docker pull` failed with
        # `no matching manifest for linux/arm64/v8`.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: ver
        run: |
          # On a tag push (`refs/tags/v0.1.0`), GITHUB_REF_NAME is
          # `v0.1.0`. On workflow_dispatch the ref is a branch, so
          # fall back to a sentinel that still lets buildx do its
          # work without a meaningful tag.
          if [[ "$GITHUB_REF_TYPE" = "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dryrun"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

      - name: Build and (maybe) push image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          # Multi-arch build. On a
          # real tag push we publish a manifest list spanning amd64 +
          # arm64; on workflow_dispatch we fall back to amd64 only
          # because (a) buildx cannot `--load` a manifest list into
          # the runner's Docker daemon, and (b) the QEMU-emulated
          # arm64 leg roughly triples the build wall time, which is
          # wasted cost for a smoke test that never ships an image.
          platforms: ${{ inputs.dry_run != true && github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ inputs.dry_run != true && github.event_name == 'push' }}
          tags: |
            ghcr.io/kozou-dev/kozou:v${{ steps.ver.outputs.version }}
            ghcr.io/kozou-dev/kozou:latest

      - name: Install cosign
        if: ${{ inputs.dry_run != true && github.event_name == 'push' }}
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign image with cosign (keyless)
        if: ${{ inputs.dry_run != true && github.event_name == 'push' }}
        env:
          # For a multi-arch build `steps.build.outputs.digest` is
          # the index/manifest-list digest. Signing the index is the
          # documented way to attest a multi-arch image - `cosign
          # verify` against either the tag or a per-arch digest then
          # resolves back to this signature.
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/kozou-dev/kozou@${DIGEST}"

  github-release:
    name: Create GitHub Release with signed npm tarballs
    needs: [publish-npm, publish-docker]
    if: ${{ inputs.dry_run != true && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Cosign sign-blob also goes through Fulcio + Rekor (keyless).
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm -r run build

      - name: Pack tarballs (matches what publish-npm sent up)
        # IMPORTANT: use `pnpm pack`, not `npm pack`. pnpm rewrites
        # every `workspace:*` reference inside the tarball's
        # `package.json` to the resolved semver of the dependency
        # at publish time, which is the same transformation
        # `pnpm publish` applies on the registry side. `npm pack`
        # leaves `workspace:*` literal, which would make the
        # signed GitHub Release tarballs differ from the npm
        # registry tarballs AND make them uninstallable for any
        # downstream consumer.
        run: |
          mkdir -p artifacts
          for d in core introspect mcp kozou svelte-ui api codegen; do
            (cd "packages/$d" && pnpm pack --pack-destination ../../artifacts)
          done
          ls -la artifacts/

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign each tarball with cosign sign-blob
        run: |
          for f in artifacts/*.tgz; do
            echo "Signing $f"
            cosign sign-blob --yes \
              --bundle "$f.bundle" \
              "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kozou ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tgz
            artifacts/*.bundle

  # ==========================================================
  # 5. update-docs-site — after a real publish, bump the pinned
  #    @kozou/core in kozou-site, regenerate its version regions
  #    (pnpm gen:docs), and open a PR. Cross-repo writes go
  #    through a GitHub App token, never the default GITHUB_TOKEN.
  #    continue-on-error: the publish already succeeded, so a docs
  #    PR failure must never turn the release red.
  # ==========================================================
  update-docs-site:
    name: Open kozou-site docs bump PR
    needs: publish-npm
    if: ${{ inputs.dry_run != true && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check for the kozou-site bump App credentials
        id: guard
        env:
          APP_ID: ${{ secrets.KOZOU_SITE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.KOZOU_SITE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::KOZOU_SITE_APP_ID / KOZOU_SITE_APP_PRIVATE_KEY are not both set; skipping the kozou-site docs bump. Provision the GitHub App to enable it."
          fi

      - name: Mint a GitHub App token scoped to kozou-site
        id: app-token
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.KOZOU_SITE_APP_ID }}
          private-key: ${{ secrets.KOZOU_SITE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kozou-site
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout kozou-site
        if: steps.guard.outputs.enabled == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository_owner }}/kozou-site
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: kozou-site

      - name: Install pnpm
        if: steps.guard.outputs.enabled == 'true'
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: kozou-site/package.json

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version-file: kozou-site/.nvmrc

      - name: Bump kozou packages and regenerate docs
        id: bump
        if: steps.guard.outputs.enabled == 'true'
        working-directory: kozou-site
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${REF_NAME#v}"
          if [ ! -f scripts/gen-docs.mjs ]; then
            echo "::notice::kozou-site has no scripts/gen-docs.mjs on main yet; skipping until the docs generator is merged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Retry: npm needs a moment to propagate the freshly published version.
          # @kozou/core feeds the version regions; kozou (the CLI) feeds the
          # generated CLI reference. Both publish together from this release.
          for attempt in 1 2 3 4 5; do
            if pnpm add -E "@kozou/core@${version}" "kozou@${version}"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::@kozou/core@${version} / kozou@${version} are not installable after retries."
              exit 1
            fi
            echo "Attempt ${attempt} failed; waiting for npm to propagate ${version}..."
            sleep 15
          done
          pnpm gen:docs
          # Detect real changes in the allowlist. Use `git status --porcelain`
          # rather than `git diff` so freshly generated (untracked) files are
          # counted too, not only edits to already-tracked files.
          if [ -z "$(git status --porcelain -- package.json pnpm-lock.yaml src/content/docs)" ]; then
            echo "::notice::kozou-site is already at ${version}; nothing to bump."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          fi
          # Surface anything generated outside the allowlist; it will not be committed.
          if [ -n "$(git status --porcelain -- . ':!package.json' ':!pnpm-lock.yaml' ':!src/content/docs')" ]; then
            echo "::warning::Changes outside the docs allowlist were produced; they will not be included in the PR."
          fi

      - name: Open the bump pull request
        if: steps.guard.outputs.enabled == 'true' && steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: kozou-site
          base: main
          branch: bump/kozou-${{ steps.bump.outputs.version }}
          delete-branch: true
          add-paths: |
            package.json
            pnpm-lock.yaml
            src/content/docs/**
          commit-message: 'chore(deps): bump kozou packages to ${{ steps.bump.outputs.version }} and regenerate docs'
          title: 'chore(deps): bump kozou packages to ${{ steps.bump.outputs.version }} and regenerate docs'
          body: |
            Automated by the kozou release pipeline after publishing `${{ github.ref_name }}`.

            - Bumps the pinned `@kozou/core` and `kozou` dependencies to `${{ steps.bump.outputs.version }}`.
            - Regenerates the product-coupled docs regions with `pnpm gen:docs`
              (version regions, CLI reference, and ui-hints reference).

            Review the regenerated docs in the diff, then merge to deploy.
