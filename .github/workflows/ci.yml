name: CI

# pnpm workspace の typecheck / lint / test を毎 push と PR で実行する。
# Step 3 で実装が入るまでは typecheck + lint のみ。test は --if-present で
# skeleton 段階の package を skip する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supply chain hardening (Codex W2 反映、Step 4-A3-c):
# 最小 permissions を top-level で明示。各 job が必要な scope は job 側で
# additive に上書きする (本 workflow は read のみで十分)。
permissions:
  contents: read

# 2026-06-02 から GitHub Actions が Node.js 24 をデフォルトに強制する暫定対応。
# license-check.yml と同じ env を workflow level に置く。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  typecheck-lint-test:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    # Step 3-4: @kozou/introspect の test を dual mode で実行するため、
    # postgres:16 を service container として常時起動する。
    # ローカルでは testcontainers が代替する (KOZOU_TEST_DATABASE_URL 未設定時)。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kozou
          POSTGRES_DB: kozou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KOZOU_TEST_DATABASE_URL: postgres://postgres:kozou@localhost:5432/kozou_test
    steps:
      # Codex W2: third-party actions は SHA pin (Dependabot で自動更新)。
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: pnpm を install
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Node を setup (with pnpm cache)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: dependencies を install
        run: pnpm install --frozen-lockfile

      - name: typecheck (pnpm -r)
        run: pnpm -r typecheck

      - name: lint (root eslint .)
        run: pnpm run lint

      - name: test (--if-present, skeleton 段階では skip)
        run: pnpm -r --if-present test
