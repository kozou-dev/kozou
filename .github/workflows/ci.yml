name: CI

# Runs typecheck / lint / test on the pnpm workspace for every push and
# every PR. Step 3 is when real implementation lands; before that, only
# typecheck + lint run. Tests use --if-present so skeleton packages skip
# gracefully.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supply chain hardening (Codex W2, Step 4-A3-c): declare the minimum
# permissions at the top level. Each job adds the additional scopes it
# needs (this workflow only needs read access).
permissions:
  contents: read

# Stop-gap for the GitHub Actions Node.js 24 default rollout (2026-06-02).
# license-check.yml uses the same env at the workflow level.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  typecheck-lint-test:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    # Step 3-4: @kozou/introspect tests run in dual mode, so we keep a
    # postgres:16 service container around. Locally, testcontainers takes
    # over when KOZOU_TEST_DATABASE_URL is not set.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kozou
          POSTGRES_DB: kozou_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KOZOU_TEST_DATABASE_URL: postgres://postgres:kozou@localhost:5432/kozou_test
      # svelte-check + Svelte 5 + the @kozou/svelte-ui workspace push
      # past the ubuntu-latest runner's default Node heap (~2 GB).
      # Bump to 4 GB; the runner has 16 GB total RAM so this is well
      # within budget.
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      # Codex W2: SHA-pin third-party actions (kept fresh by Dependabot).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages (so workspace:* deps resolve)
        # Step 7-A flipped @kozou/core / @kozou/introspect / @kozou/mcp
        # / kozou to publish through `./dist/`, which means downstream
        # workspace consumers (and `tsc --noEmit`) now resolve those
        # packages via `package.json#types` -> `dist/index.d.ts`.
        # Running typecheck against a fresh checkout without `dist/`
        # produces "Cannot find module '@kozou/core'" - build first.
        run: pnpm -r run build

      - name: Typecheck (pnpm -r)
        run: pnpm -r typecheck

      - name: Lint (root eslint .)
        run: pnpm run lint

      - name: Test (--if-present; skipped for skeleton packages)
        run: pnpm -r --if-present test

  e2e:
    name: Playwright E2E (svelte-ui)
    runs-on: ubuntu-latest
    # No postgres service container at the runner level - the Playwright
    # globalSetup spins up its own postgres + postgrest pair via
    # testcontainers so the E2E suite owns its DB lifecycle end-to-end.
    # (See packages/svelte-ui/e2e/setup/global-setup.ts.)
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # global-setup spawns `node packages/svelte-ui/build/index.js`,
        # which requires the adapter-node build output to exist; build
        # the whole workspace so `@kozou/core` / `@kozou/introspect`
        # also have their `dist/` outputs ready for the runtime stage.
        run: pnpm -r run build

      - name: Install Playwright browser (chromium)
        # `--with-deps` brings the OS libs Chromium needs on the runner;
        # we only install chromium because the suite does not target
        # cross-browser parity in v0.1.1.
        run: pnpm --filter @kozou/svelte-ui exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm --filter @kozou/svelte-ui run test:e2e

  e2e-kozou-dev:
    name: Playwright E2E (kozou dev)
    runs-on: ubuntu-latest
    # Mirrors the svelte-ui E2E job, but launches `node dist/cli.js dev`
    # so the dev command's own wiring (config -> env, ORIGIN propagation,
    # MCP HTTP in-process, both servers together) is exercised against a
    # real postgres + REST-adapter stack. The Playwright globalSetup owns
    # the DB lifecycle via testcontainers, same as the svelte-ui suite.
    # (See packages/kozou/e2e/setup/global-setup.ts.)
    env:
      NODE_OPTIONS: '--max-old-space-size=4096'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        # global-setup spawns `node packages/kozou/dist/cli.js dev`, which
        # in turn spawns `packages/svelte-ui/build/index.js`; build the
        # whole workspace so both outputs (and the workspace:* deps they
        # resolve) are ready before the runtime stage.
        run: pnpm -r run build

      - name: Install Playwright browser (chromium)
        run: pnpm --filter kozou exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm --filter kozou run test:e2e
