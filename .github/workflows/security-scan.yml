name: Security scan

# 機密漏洩 / dependency 脆弱性の自動スキャン。Step 4-A4-b で追加、Step 4-A4-d/e/f
# で action 形式の修正を反映。
#
# 2 job 構成:
# - secret-scan (gitleaks, MIT): gitleaks CLI を docker で直接実行
#   (gitleaks-action v2 は organization 向け commercial license のため不採用)
# - dependency-scan (OSV-Scanner, Apache 2.0): google/osv-scanner-action の
#   reusable workflow form (root action.yml は brand info のみで runs: なし)
#
# CodeQL は v0.1.1 で別途追加予定 (GHAS code-scanning enable 設定が必要、
# Step 4-A4 の CI で SARIF upload に失敗したため一旦削除)。
# trufflehog (AGPL-3) は Kozou v0.1 license compliance §4 の禁則語に該当、不採用。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週日曜 00:00 UTC (日本時間 月曜 09:00) に full scan
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Supply chain hardening (Step 4-A3-c と同 pattern): 最小 permissions top-level
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # gitleaks は git history も走査するため full clone が必要
          fetch-depth: 0

      - name: gitleaks scan
        # gitleaks-action v2 は organization 向けに commercial license 化された
        # (free repo でも GITLEAKS_LICENSE secret 必要)。代わりに gitleaks CLI
        # (MIT) を docker (zricethezav/gitleaks) で直接実行することで license
        # fee 不要かつ kozou OSS と整合する形に統一。
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest \
            detect --source . --config .gitleaks.toml --verbose --redact

  dependency-scan:
    name: Dependency CVE (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: OSV-Scanner
        # google/osv-scanner-action の reusable workflow form は SARIF を
        # code-scanning に upload するため GHAS (Advanced Security) 必須。
        # public repo の GHAS は default disable のことが多いため、osv-scanner
        # CLI を docker で直接実行する形に統一 (gitleaks と同 pattern)。
        # 結果は CI log に出力、high CVE 検出時は exit code != 0 で fail。
        # GHAS + reusable workflow + CodeQL の完全 setup は v0.1.1 で対応予定。
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/google/osv-scanner:latest \
            -r ./
