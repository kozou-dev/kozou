# Quickstart demo stack.
#
# Brings up:
#   - postgres   PostgreSQL 16, initialized with ./schema.sql (the demo store
#                schema + seed data).
#   - kozou      `kozou dev` — the bundled Admin UI (:3333) and the MCP HTTP
#                server (:3334), plus Kozou's in-house REST backend on the
#                container's own loopback, unpublished
#                (ghcr.io/kozou-dev/kozou).
#
# Usage:
#   cp .env.example .env
#   docker compose up
#
# Then open the Admin UI at http://localhost:3333 and point an MCP client
# (Claude Code / Claude Desktop / Cursor) at http://localhost:3334/mcp.
# See README.md for the full walkthrough and the before/after comparison.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kozou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kozou}
      POSTGRES_DB: ${POSTGRES_DB:-kozou}
    ports:
      # Loopback only: the demo database uses default credentials, so it must
      # not be reachable from the LAN. Connect local tools via 127.0.0.1.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Loaded once, in filename order, on first startup of an empty data dir.
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kozou}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kozou:
    image: ghcr.io/kozou-dev/kozou:v1.19.0
    command: ["dev"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kozou}:${POSTGRES_PASSWORD:-kozou}@postgres:5432/${POSTGRES_DB:-kozou}
      # The Admin UI (SvelteKit / adapter-node) needs ORIGIN to accept form
      # POSTs over plain http. Set it to the URL you open in the browser.
      ORIGIN: ${KOZOU_ORIGIN:-http://localhost:3333}
      # Bind the no-auth Admin UI and MCP HTTP server to all interfaces *inside*
      # the container so the loopback-published host ports below can reach them.
      KOZOU_UI_HOST: 0.0.0.0
      KOZOU_MCP_HTTP_HOST: 0.0.0.0
      # Whether to serve the MCP HTTP endpoint at all (empty = unset = on).
      # There is no kozou.config.yaml in this stack, so this is the way to opt
      # out: KOZOU_MCP_HTTP_ENABLED=false runs Admin UI + REST only, with no
      # MCP listener and no "Connect an AI agent" page in the Admin UI.
      KOZOU_MCP_HTTP_ENABLED: ${KOZOU_MCP_HTTP_ENABLED:-}
      # Where MCP clients reach the endpoint, when that is not the port below.
      # This stack binds 3334 in the container and publishes it on the same
      # host port; remap that mapping (a clash with something already on 3334)
      # or put a tunnel or proxy in front, and the "Connect an AI agent" page
      # has no way to know — it would hand out the container-side port. Set
      # this to the address clients should register. Its path must be exactly
      # /mcp, so a proxy that mounts the endpoint under a prefix cannot be
      # advertised here:
      # KOZOU_MCP_HTTP_ADVERTISED_URL=http://localhost:4334/mcp
      # Refused at startup alongside KOZOU_MCP_HTTP_ENABLED=false.
      KOZOU_MCP_HTTP_ADVERTISED_URL: ${KOZOU_MCP_HTTP_ADVERTISED_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Published on host loopback only: the Admin UI and MCP HTTP server have no
    # authentication by default, so they must not be reachable from the LAN. You
    # open them from this host at 127.0.0.1; the container still binds 0.0.0.0
    # internally so the mapping works.
    # Compose has no conditional `ports`, so the MCP mapping is listed even when
    # KOZOU_MCP_HTTP_ENABLED=false. No MCP endpoint is served then — but the
    # mapping is not free: Docker still holds host port 3334, so a `kozou dev`
    # on the host cannot bind it while this stack is up. The label carries the
    # condition because this file cannot drop the line.
    ports:
      - "127.0.0.1:3333:3333"   # Admin UI (no auth by default)
      - "127.0.0.1:3334:3334"   # MCP HTTP (no auth; not served if opted out)
