# UI Hints (Nimart sample, optional minimal)
# このファイルは optional。DDL + COMMENT だけで合理的なデフォルト UI が生成される (dev_spec §6.4)。
# UI Hints は presentation の好みのみを上書きする (label の言語化、widget の明示など)。
#
# YAML 文法の最終形は §16.1 の意図的 open item として実装中 (@kozou/core) で確定する。
# 本ファイルは v0.1 の最小サンプル。

tables:
  artists:
    label: 作家
    columns:
      display_name:
        label: 表示名
      legal_name:
        label: 戸籍名
      nationality_code:
        label: 国籍

  artworks:
    label: 作品
    columns:
      title:
        label: 作品名
      medium_code:
        label: 媒体
      catalog_number:
        label: カタログ番号

  editions:
    label: エディション
    columns:
      edition_label:
        label: エディション名
      total_count:
        label: 刷数

  inventory_items:
    label: 在庫個体
    columns:
      serial_number:
        label: シリアル番号
      status:
        label: 在庫状態
      selling_price:
        label: 販売価格
        widget: currency

  images:
    label: 画像
    columns:
      url:
        label: 画像 URL

  code_sets:
    label: コード集合
  code_values:
    label: コード値
