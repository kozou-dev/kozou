title = "kozou v0.1 gitleaks config"

# GitHub default ruleset + custom allowlist (Step 4-A4-c で narrow 化)
[extend]
useDefault = true

# Demo / test / example credentials が誤検知されないよう、specific な
# literal pattern のみ allowlist。
#
# 設計方針 (Codex W1 反映):
# 過去版で paths を broad に exclude (docs/demo, scripts/demo, *.example 等)
# する設計だったが、これらの path に将来実 secret が誤 commit された場合
# catch できないリスクがあった。本版では regex で具体的な demo literal
# のみ allowlist し、path-based exclude は廃止。
[allowlist]
description = "kozou demo / test 専用の literal を narrow regex で allowlist"

regexes = [
  # demo container password literal: docker --rm で即廃棄、外部接続不可
  '''postgres:demo@localhost''',
  # CI test / demo の固定 password 値 (POSTGRES_PASSWORD: demo / kozou)
  '''POSTGRES_PASSWORD:?\s*(demo|kozou)\b''',
  # test 用 env 変数名 (値ではない)
  '''KOZOU_TEST_DATABASE_URL''',
]
