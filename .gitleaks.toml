title = "kozou v0.1 gitleaks config"

# Extends the GitHub default ruleset; the allowlist was narrowed in Step 4-A4-c.
[extend]
useDefault = true

# Only specific demo / test literal patterns are allowlisted so any real
# secret accidentally committed in the future still gets caught.
#
# Design rationale (Codex W1):
# Earlier revisions excluded broad paths (docs/demo, scripts/demo,
# *.example, etc.). That setup hid real secrets that might end up under
# those paths. The current allowlist matches narrow regexes over specific
# demo literals only; path-based exclusions have been removed.
[allowlist]
description = "Narrow demo / test literals used by kozou"

regexes = [
  # demo-container password literal: lives inside `docker run --rm`
  # containers that never accept external traffic
  '''postgres:demo@localhost''',
  # CI test / demo fixed password values (POSTGRES_PASSWORD: demo / kozou)
  '''POSTGRES_PASSWORD:?\s*(demo|kozou)\b''',
  # Test env var name (not the value)
  '''KOZOU_TEST_DATABASE_URL''',
]
