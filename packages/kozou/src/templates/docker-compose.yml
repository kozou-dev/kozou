# Docker Compose stack for a kozou project.
#
# Brings up:
#   - postgres   PostgreSQL 16 (the source of truth)
#   - kozou      `kozou dev` - the bundled Admin UI + MCP HTTP server, plus
#                Kozou's in-house REST backend served in-process
#                (ghcr.io/kozou-dev/kozou). Binds 0.0.0.0 inside the
#                container so the port mappings below reach your host.
#
# The Admin UI talks to Kozou's in-house REST layer by default — no separate
# REST container is needed. To opt out and use an external PostgREST instead,
# see the commented service and notes at the bottom of this file.
#
# Customize the credentials in .env before running `docker compose up`.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kozou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kozou}
      POSTGRES_DB: ${POSTGRES_DB:-kozou}
    ports:
      # Loopback only: the default credentials above mean this port must not be
      # reachable from the LAN. Connect local tools via 127.0.0.1; change this
      # deliberately (with real credentials) if you need external DB access.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kozou}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kozou:
    # `kozou dev` spawns the bundled @kozou/svelte-ui Admin UI, the MCP HTTP
    # server, and Kozou's in-house REST backend (all in-process). Each binds
    # 0.0.0.0 inside the container so the port mappings below reach your host.
    image: ghcr.io/kozou-dev/kozou:v1.14.0
    command: ["dev"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kozou}:${POSTGRES_PASSWORD:-kozou}@postgres:5432/${POSTGRES_DB:-kozou}
      # The Admin UI is a SvelteKit (adapter-node) app. Without ORIGIN
      # it assumes https and rejects every form POST (create / edit /
      # delete) over plain http with a 403 "Cross-site POST forbidden".
      # Set it to the exact URL you open in the browser; override if you
      # publish the Admin UI on a different host or port.
      ORIGIN: ${KOZOU_ORIGIN:-http://localhost:3333}
      # Bind the no-auth Admin UI and MCP HTTP server to all interfaces *inside*
      # the container so the loopback-published host ports below can reach them.
      # They default to loopback when run outside a container.
      KOZOU_UI_HOST: 0.0.0.0
      KOZOU_MCP_HTTP_HOST: 0.0.0.0
      # JWT auth (see .env.example). Compose reads .env for ${VAR}
      # interpolation only, so every variable must be forwarded here
      # explicitly to reach the container. An empty value means unset:
      # kozou treats empty auth variables as absent, so leaving these
      # blank keeps auth off (it never means "HS256 with empty secret").
      KOZOU_JWT_SECRET: ${KOZOU_JWT_SECRET:-}
      KOZOU_JWT_PUBLIC_KEY: ${KOZOU_JWT_PUBLIC_KEY:-}
      KOZOU_JWT_JWKS_URI: ${KOZOU_JWT_JWKS_URI:-}
      KOZOU_JWT_ALGORITHMS: ${KOZOU_JWT_ALGORITHMS:-}
      KOZOU_JWT_ISSUER: ${KOZOU_JWT_ISSUER:-}
      KOZOU_JWT_AUDIENCE: ${KOZOU_JWT_AUDIENCE:-}
      KOZOU_JWT_ROLE_CLAIM: ${KOZOU_JWT_ROLE_CLAIM:-}
      KOZOU_JWT_ALLOWED_ROLES: ${KOZOU_JWT_ALLOWED_ROLES:-}
      KOZOU_JWT_DEFAULT_ROLE: ${KOZOU_JWT_DEFAULT_ROLE:-}
      KOZOU_JWT_ANON_ROLE: ${KOZOU_JWT_ANON_ROLE:-}
      KOZOU_JWT_CLAIMS_GUC: ${KOZOU_JWT_CLAIMS_GUC:-}
      KOZOU_UI_ROLE: ${KOZOU_UI_ROLE:-}
      KOZOU_UI_CLAIMS: ${KOZOU_UI_CLAIMS:-}
      KOZOU_ADAPTER_TOKEN: ${KOZOU_ADAPTER_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Published on host loopback only: the Admin UI and the MCP HTTP server have
    # no authentication by default, so they must not be reachable from the LAN.
    # The client (your browser / MCP client) runs on this host and reaches them
    # at 127.0.0.1. To expose them beyond this host, put an authenticating proxy
    # in front and change the bind deliberately — do not publish them unguarded.
    ports:
      - "127.0.0.1:3333:3333"   # Admin UI (no auth by default)
      - "127.0.0.1:3334:3334"   # MCP HTTP (no auth)

# --- PostgREST opt-out -------------------------------------------------------
# Kozou serves REST in-process by default. To use an external PostgREST
# instead, set `adapter.type: postgrest` in kozou.config.yaml (with its url),
# add a service like the one below, and wire the kozou service to it: add
# `KOZOU_ADAPTER_URL: http://postgrest:3000` to its environment and a
# `postgrest: { condition: service_started }` entry under its depends_on.
#
#   postgrest:
#     image: postgrest/postgrest:latest
#     environment:
#       PGRST_DB_URI: postgres://${POSTGRES_USER:-kozou}:${POSTGRES_PASSWORD:-kozou}@postgres:5432/${POSTGRES_DB:-kozou}
#       PGRST_DB_SCHEMA: public
#       PGRST_DB_ANON_ROLE: ${POSTGRES_USER:-kozou}
#     ports:
#       - "127.0.0.1:3000:3000"
#     depends_on:
#       postgres:
#         condition: service_healthy
