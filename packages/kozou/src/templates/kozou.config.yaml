# kozou.config.yaml
#
# Every field has a sensible default; only set what you need to override.
# All ${VAR} and ${VAR:-fallback} placeholders are expanded against the
# process environment at startup.

database:
  url: ${DATABASE_URL}
  schemas: [public]

server:
  ui:
    port: 3333
    host: 0.0.0.0
  mcp:
    http:
      port: 3334
      host: 0.0.0.0
    stdio: false

adapter:
  # Backend the Admin UI runs against. Defaults to "api": Kozou's in-house
  # REST layer, served in-process by `kozou dev` — no extra container needed.
  type: api
  # To opt out and use an external PostgREST instead, set type: postgrest, add
  # a postgrest service (see docker-compose.yml), and point url at it:
  #   type: postgrest
  #   url: ${KOZOU_ADAPTER_URL:-http://postgrest:3000}

# Optional: expose Postgres functions as RPC actions (POST /rpc/<schema>.<fn>).
# A function is exposed only when its COMMENT carries `@expose: rpc`. The lists
# below are the extra deploy-time opt-in the riskier cases require, as
# schema-qualified names:
# api:
#   rpc:
#     # SECURITY DEFINER functions (run as their owner, can bypass RLS) need to
#     # be listed here in addition to the tag and an owner-safe search_path.
#     allowDefiner:
#       - public.approve_order
#     # Functions that intentionally keep EXECUTE granted to PUBLIC (anon can
#     # call them). Without this, a function still granting PUBLIC EXECUTE is
#     # skipped rather than silently opened to everyone.
#     allowPublicExecute:
#       - public.search

uiHints:
  path: ./ui-hints.yaml

cache:
  ttlMs: 60000
